var REF=[
["Mechanism of injury and triage",`<ul><li>Kinetic energy = ½ × mass × velocity². <mark>Speed matters more than mass.</mark></li>
<li>Five crash types: frontal, lateral (T-bone), rear-end, rotational, rollover. Ejection and death in the compartment are high-risk.</li>
<li>Significant fall: adult &gt;20 ft (about 3× height for a child, roughly &gt;10 ft). Note surface, height and body part that landed first.</li>
<li>Penetrating: low velocity (hand-propelled), medium (handgun, arrow), high (rifle, with <b>cavitation</b>). Always look for the exit wound.</li>
<li>Blast: <b>primary</b> pressure wave (ears, lungs, bowel), <b>secondary</b> flying debris, <b>tertiary</b> thrown body, <b>quaternary/misc</b> burns, crush, toxic exposure.</li>
<li><b>Emergency move</b>: immediate danger, little spinal care. <b>Urgent move</b>: rapid extrication with manual stabilization.</li>
<li>Rapid trauma assessment order: head, neck, chest, abdomen, pelvis, extremities, back, using <b>DCAP-BTLS</b> (deformities, contusions, abrasions, punctures, burns, tenderness, lacerations, swelling).</li></ul>`],
["Bleeding control and shock",`<ul><li>Order: direct pressure / pressure dressing, then <mark>tourniquet</mark> for life-threatening limb bleeding, wound packing with hemostatic gauze for junctional areas, pelvic binder for suspected pelvic fracture.</li>
<li>Tourniquet: place high and tight (proximal to the wound), tighten until bleeding stops, add a second one if needed, <b>write the time</b>, do not loosen in the field.</li>
<li>Epistaxis: pinch the soft nose and lean forward; don't let the patient swallow blood.</li>
<li>Suspect internal bleeding with a consistent MOI plus shock signs and no other cause. Treat shock, nothing by mouth, rapid transport to a surgical hospital.</li></ul>
<table><tr><th>Compensated</th><th>Decompensated</th></tr><tr><td>Anxiety, restlessness, impending doom; weak rapid pulse; pale, cool, moist skin; rapid shallow breathing; thirst; pulse pressure narrowing</td><td>Systolic &lt;90, absent radial pulse; labored or irregular breathing; ashen, mottled skin; dull eyes, dilated pupils; low urine output</td></tr></table>
<table><tr><th>Shock type</th><th>Cause and key clue</th></tr>

["Soft-tissue injuries and burns",`<ul><li><b>Abrasion</b> scrape; <b>laceration</b> jagged cut; <b>incision</b> smooth cut; <b>contusion</b> bruise; <b>ecchymosis</b> discoloration showing bleeding; <b>hematoma</b> pooled blood; <b>avulsion</b> flap or torn-away tissue; <b>amputation</b> severed part; <b>evisceration</b> organs outside the body.</li>
<li><b>Avulsion:</b> brush off loose debris, replace flap to anatomic position, control bleeding, dry sterile dressing. Don't irrigate or complete the tear.</li>
<li><b>Amputation:</b> control bleeding (tourniquet if needed). Wrap part in sterile gauze moistened with saline, seal in a bag, keep cool on ice. Don't let it freeze or sit directly in ice or water.</li>
<li><b>Evisceration:</b> don't push organs back. Cover with moist sterile dressing, then an occlusive cover; flex hips and knees if no spinal concern.</li>
<li><b>Impaled object:</b> stabilize in place and control bleeding. <mark>Remove only if it blocks the airway or prevents CPR.</mark></li>
<li><b>Compartment syndrome</b> (6 Ps): pain, pressure, pallor, paralysis, paresthesia, pulselessness (later). <b>Crush syndrome</b>: prolonged entrapment leading to hyperkalemia and kidney failure.</li></ul>
<b>Burns</b><ul><li>Depth: superficial (epidermis, red, painful), partial thickness (dermis, blisters), full thickness (leathery, charred, may be painless).</li>
<li>Rule of nines, adult: head 9, each arm 9, front trunk 18, back 18, each leg 18, genitals 1. Child: head 18, each leg 14. Patient’s palm and fingers ≈ 1% BSA.</li>
<li>Critical: full thickness &gt;10% BSA; hands, feet, face, genitals or airway; circumferential; inhalation signs (soot, hoarseness, singed hair); burns plus fractures; age &lt;5 or &gt;55.</li>
<li>Carbon monoxide binds hemoglobin, so <mark>SpO₂ can read falsely normal</mark>. Steam burns: secure the airway early. Stop the burning, cool minor burns briefly, cover with dry sterile dressing, keep warm.</li></ul>`],
["Head and spine injuries",`<ul><li><b>GCS</b>: eyes 4 + verbal 5 + motor 6 = 3–15. ≤8 is severe.</li>
<li><b>Cushing’s reflex</b> (rising ICP): <mark>hypertension with widening pulse pressure, bradycardia, irregular respirations</mark>. Late signs: unequal or blown pupil, posturing.</li>
<li>Epidural: arterial bleed, <b>lucid interval</b>, rapid deterioration. Subdural: venous, slower, common in older adults. Concussion: functional, no visible damage. Contusion: bruised brain tissue. Primary injury is direct; secondary injury comes from hypoxia and hypotension.</li>
<li>Treat TBI: airway with jaw thrust, high-flow oxygen, keep SpO₂ ≥94%, avoid hypotension, ventilate only for herniation signs, check pupils and GCS serially.</li>
<li>Scalp wounds bleed heavily. Control with direct pressure, but don’t press on a depressed skull fracture.</li>
<li>Spinal injury complications: neurogenic shock, respiratory failure (injury above C3–C5), loss of motor and sensory function, priapism.</li>
<li><b>Spinal motion restriction (SMR)</b> is based on mechanism plus findings: midline pain or tenderness, neuro deficit, altered mental status, intoxication, distracting injury, or high-risk MOI. Use a collar and stretcher; the long board is an extrication tool, not treatment.</li></ul>`],
["Chest injuries",`<table><tr><th>Condition</th><th>Key findings</th><th>Care</th></tr>
<tr><td>Open pneumothorax (sucking wound)</td><td>Sucking sound, bubbling blood</td><td>Occlusive dressing taped on three sides or vented seal; monitor for tension</td></tr>
<tr><td>Tension pneumothorax</td><td>Absent or decreased breath sounds on one side, hyperresonance, JVD, falling BP, late tracheal deviation</td><td>Oxygen, rapid transport, ALS for decompression; burp the seal if it’s from an occlusive dressing</td></tr>
<tr><td>Cardiac tamponade</td><td><mark>Beck’s triad:</mark> JVD, muffled heart tones, hypotension; <b>breath sounds equal</b>; narrowing pulse pressure</td><td>Oxygen, rapid transport, ALS</td></tr>
<tr><td>Flail chest</td><td>Paradoxical motion, pain, shallow breathing</td><td>Oxygen, assist ventilation if needed, stabilize with bulky dressing</td></tr>
<tr><td>Commotio cordis</td><td>Blunt blow to the chest (e.g., baseball) causes sudden arrest, V-fib</td><td>CPR and AED immediately</td></tr>
<tr><td>Hemothorax</td><td>Dull percussion, shock signs</td><td>Oxygen, treat shock, transport</td></tr></table>
<ul><li><b>Subcutaneous emphysema</b>: crackling “Rice Krispies” under the skin from air in tissue. <b>Crepitus</b>: grating of bone ends.</li>
<li>Referred pain: <b>Kehr’s sign</b> is left shoulder pain from splenic bleeding irritating the diaphragm.</li></ul>`],
["Abdomen, pelvis and orthopedics",`<ul><li>Solid organs (liver, spleen, kidneys) bleed; hollow organs (bowel, stomach) leak and cause peritonitis. Signs: rigidity, guarding, distention, bruising (Cullen’s periumbilical, Grey Turner flank).</li>
<li>Pelvis: compress once only; if unstable or painful, don’t re-examine, bind. Expect major blood loss.</li>
<li>Check pulse, motor, sensation (PMS) before and after splinting. Splint joints above and below. Realign only if pulseless or severely deformed, per protocol.</li>
<li>Traction splint: isolated midshaft femur fracture. Avoid if pelvic, hip, knee or lower-leg injury or partial amputation.</li>
<li>Sprain = ligament; strain = muscle or tendon; dislocation = joint ends separated.</li></ul>`],
["Environmental emergencies",`<ul><li>Heat: cramps (cool, hydrate), exhaustion (cool, sweating, hydrate), <mark>heat stroke</mark> (altered mental status, hot skin; rapid cooling and transport, life-threatening).</li>
<li>Hypothermia: remove wet clothing, insulate, handle gently, passive then active rewarming; check pulse up to 30–45 seconds.</li>
<li>Frostbite: don’t rub, don’t rewarm if refreezing is possible. Drowning: airway and ventilation first, and suspect spinal injury only with diving, trauma or alcohol.</li></ul>`],
